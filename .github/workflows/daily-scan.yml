name: Daily NHS sponsorship scan

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nhs_sponsorship_finder_clean/requirements.txt

      - name: Install requirements
        working-directory: nhs_sponsorship_finder_clean
        run: pip install -r requirements.txt

      - name: Scan NHS Jobs
        working-directory: nhs_sponsorship_finder_clean
        run: python scanner.py

      - name: Save scan results
        run: |
          git config user.name "nhs-sponsorship-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nhs_sponsorship_finder_clean/data/jobs.db

          if git diff --cached --quiet; then
            echo "No database changes"
          else
            git commit -m "Update NHS sponsorship jobs"
            git push
          fi
